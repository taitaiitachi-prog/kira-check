<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="kc-build" content="2026-11-05T07:37:26.274Z">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>kira-check</title>
<style>
/* 落ち着いたダーク。色は意味のある所だけ（1人目＝青・2人目＝ばら色、新しい＝金） */
:root {
  --bg: #15171a; --panel: #1d2024; --line: #2c3036; --text: #e6e8eb; --sub: #8d949c;
  --on: #5fc9a8; --off: #4a5058; --gold: #d9b45a; --err: #e07a6e;
  --pa: #6fa8dc; --pb: #d98fb0;
  /* 大きさ：倍率 --s（1.0〜1.6。設定のバーで人ごと。ui.js の applySize が入れる）から、
     文字・入力欄・ボタンの高さ・行の高さ・絵・衣装欄・−＋の幅・印の欄を決める */
  --s: 1;
  --fs: calc(15px * var(--s)); --fin: max(16px, calc(16px * var(--s))); --h: calc(40px * var(--s)); --row: calc(56px * var(--s));
  --thw: calc(72px * var(--s)); --thh: calc(54px * var(--s)); --smw: calc(48px * var(--s)); --smh: calc(36px * var(--s));
  --cos-w: calc(56px + 20px * var(--s)); --stb: calc(30px * var(--s)); --mkw: calc(64px * var(--s));
}
* { box-sizing: border-box; margin: 0; }
/* --vh：キーボードを除いた見えている高さ（ui.js の fitKeyboard が入れる） */
html, body { height: var(--vh, 100%); background: var(--bg); color: var(--text); overflow: hidden; }
body {
  font: var(--fs)/1.4 system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif;
  touch-action: manipulation; -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent;
}
button, input { font: inherit; color: inherit; }
/* iPhone は 16px 未満の入力欄で勝手に拡大するので 16px 以上 */
input { font-size: var(--fin); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 0 10px; height: var(--h); min-width: 0; outline: none; }
input:focus { border-color: var(--sub); }
input[type=search]::-webkit-search-cancel-button { filter: invert(.7); }

#app { height: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; position: relative; }
.tabs { display: flex; border-bottom: 1px solid var(--line); flex: none; }
.tabs button { flex: 1; height: calc(var(--h) + 6px); background: none; border: 0; color: var(--sub); border-bottom: 2px solid transparent; }
.tabs button.on { color: var(--text); border-bottom-color: var(--text); }
.loadbar, .progress { height: 2px; flex: none; background: transparent; overflow: hidden; }
.loadbar i, .progress i { display: block; height: 100%; width: 0; background: var(--sub); transition: width .2s; }
/* 待っている間：短い線が左から右へ流れる */
.loadbar.busy i { width: 30%; animation: kc-run 1.1s linear infinite; }
@keyframes kc-run { from { transform: translateX(-100%); } to { transform: translateX(340%); } }

.page { display: none; flex: 1; min-height: 0; flex-direction: column; }
.page.on { display: flex; }
.bar { display: flex; gap: 8px; align-items: center; padding: 10px 12px; flex: none; }
.bar input { flex: 1; }
.grow { flex: 1; min-width: 0; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding-bottom: calc(var(--h) + 24px); }
/* 入力中は下に余白を足し、下の方の行も上まで動かせるようにする */
.scroll.typing { padding-bottom: var(--vh, 100vh); }

.btn { height: var(--h); padding: 0 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); display: inline-flex; align-items: center; justify-content: center; white-space: nowrap; cursor: pointer; flex: none; }
.btn.main { background: var(--text); color: var(--bg); border-color: var(--text); font-weight: 600; }
.btn:disabled { opacity: .35; cursor: default; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex: none; }
.seg button { height: calc(var(--h) - 2px); min-width: 52px; max-width: calc(var(--fs) * 6.4); padding: 0 10px; background: none; border: 0; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--panel); color: var(--text); }
/* 2人の色：取り込みで選んでいる人はボタンを塗る。一覧の絞り込みは文字と下線 */
#who button.on.pa, #me button.on.pa { background: var(--pa); color: var(--bg); font-weight: 600; }
#who button.on.pb, #me button.on.pb { background: var(--pb); color: var(--bg); font-weight: 600; }
#filter button.on.pa { color: var(--pa); box-shadow: inset 0 -2px var(--pa); }
#filter button.on.pb { color: var(--pb); box-shadow: inset 0 -2px var(--pb); }
#page-scan[data-who=a] #add { background: var(--pa); border-color: var(--pa); }
#page-scan[data-who=b] #add { background: var(--pb); border-color: var(--pb); }
#page-scan[data-who=a] .step b { color: var(--pa); }
#page-scan[data-who=b] .step b { color: var(--pb); }
.done .pa, .cnt-row .pa { color: var(--pa); }
.done .pb, .cnt-row .pb { color: var(--pb); }
/* 上の段（誰のスクショ・検索・名前）は横幅に収まるよう、文字は 16px まで */
.page > .bar { font-size: min(var(--fs), 16px); }
.page > .bar input { font-size: 16px; }
.page > .bar .seg button { max-width: 96px; }
/* 設定：名前の下に、その人の大きさのバー */
.bar.people { display: grid; grid-template-columns: 1fr 1fr auto; }
input.size { height: var(--h); padding: 0; border: 0; background: none; }
input.size.pa-c { accent-color: var(--pa); }
input.size.pb-c { accent-color: var(--pb); }

/* 数の −／＋ */
.step { display: inline-flex; align-items: center; height: var(--h); border: 1px solid var(--line); border-radius: 8px; flex: none; }
.step button { width: var(--stb); height: 100%; background: none; border: 0; font-size: 1.2em; cursor: pointer; }
.step button:disabled { opacity: .3; cursor: default; }
.step b { min-width: 1.3em; text-align: center; }
.had { color: var(--sub); font-size: .85em; white-space: nowrap; }
/* オスメスの ♂／♀（大きく見る画面の数の左）。2人の色とぶつかるので色は付けず、付いている方を明るく塗る */
.sex { display: inline-flex; height: var(--h); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex: none; }
.sex button { width: calc(var(--stb) + 8px); height: 100%; background: none; border: 0; color: var(--off); font-size: 1.1em; cursor: pointer; }
.sex button + button { border-left: 1px solid var(--line); }
.sex button.on { background: var(--panel); color: var(--text); font-weight: 700; }
.sex button:disabled { opacity: .3; cursor: default; }
/* 一覧の印：数の横に小さく ♂♀ */
.mk small { font-size: .6em; font-weight: 400; margin-left: 2px; }

/* 絵の行：絵・名前・2人の印。1行に収める */
.vhead, .vrow { display: grid; grid-template-columns: calc(var(--thw) + 4px) 1fr var(--mkw) var(--mkw); align-items: center; padding: 0 12px; gap: 4px; }
.vhead { height: 26px; color: var(--sub); font-size: 12px; border-bottom: 1px solid var(--line); flex: none; }
.vhead .mkh { text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vhead .mkh.pa { color: var(--pa); }
.vhead .mkh.pb { color: var(--pb); }
.vrow { height: var(--row); border-bottom: 1px solid var(--line); }
.vrow .nm, .srow .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nm small { font-size: .85em; color: var(--sub); margin-left: 6px; }
/* 衣装名の欄（種族の右） */
input.cos { flex: none; width: var(--cos-w); padding: 0 8px; }
input.cos:disabled { opacity: .5; }
.nmcell { display: flex; gap: 6px; min-width: 0; }
.nmcell .picker { flex: 1; }
/* 絵の枠。切り抜きは背景の玉が多いので、ポケモンのいる真ん中下を拡大して見せる */
.th { width: var(--thw); height: var(--thh); border-radius: 6px; overflow: hidden; background: #222529; display: block; cursor: pointer; flex: none; }
.th img { width: 100%; height: 100%; display: block; transform: scale(1.4); transform-origin: 50% 72%; }
.th.sm { width: var(--smw); height: var(--smh); border-radius: 4px; }
.vhead .th { visibility: hidden; height: 0; }
.mk { height: var(--row); border: 0; background: none; font-size: 1.33em; color: var(--off); cursor: pointer; white-space: nowrap; overflow: hidden; padding: 0; }
.mk.on { font-weight: 700; }
.mk.on[data-p=a] { color: var(--pa); }
.mk.on[data-p=b] { color: var(--pb); }
.mk:disabled { cursor: default; opacity: .5; }
.vrow.none .nm { color: var(--sub); }

/* 取り込みの確認の行：絵・種族（衣装）・済の数・入れる数。ふつうの大きさは1行 */
.srow { display: grid; grid-template-columns: var(--thw) 1fr auto auto; align-items: center; gap: 4px 6px; padding: 0 12px; height: var(--row); border-bottom: 1px solid var(--line); }
/* 大きいとき（2段目から）は2段：上に種族（衣装）、下に済の数と −／＋ */
:root[data-big] .srow { grid-template-columns: var(--thw) 1fr auto; height: auto; padding: 8px 12px; }
:root[data-big] .srow .th { grid-row: 1 / 3; }
:root[data-big] .srow .nm, :root[data-big] .srow .nmcell { grid-column: 2 / 4; }
:root[data-big] .srow .had { grid-column: 2; justify-self: end; }
/* 一覧も2段：上に名前（衣装）、下に2人の印（見出しの列に合わせる） */
:root[data-big] .vrow { grid-template-rows: auto auto; height: auto; padding: 6px 12px; }
:root[data-big] .vrow .th { grid-row: 1 / 3; }
:root[data-big] .vrow .nm { grid-column: 2 / 5; }
:root[data-big] .vrow .mk { grid-row: 2; height: var(--h); }
:root[data-big] .vrow .mk:first-of-type { grid-column: 3; }
:root[data-big] .vrow .mk:last-of-type { grid-column: 4; }
.srow.off .th, .srow.off .nm { opacity: .4; }
.btn.disabled, .seg.disabled { opacity: .35; pointer-events: none; }
/* 「誰のスクショ？」：右の名前を押すと写真選びが開く */
.who-q { flex: none; color: var(--sub); white-space: nowrap; }
.done .cnt b { color: var(--gold); }
.done { padding: 12px; border-bottom: 1px solid var(--line); }
.done .cnt { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
.done .cnt b { font-size: 18px; }
.done .thumbs { display: flex; flex-wrap: wrap; gap: 4px; }

/* 種族を選ぶ欄（入力すると下に候補） */
.picker { position: relative; min-width: 0; }
.picker input { width: 100%; }
.picker .pop { position: absolute; left: 0; right: 0; top: calc(var(--h) + 2px); z-index: 20; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; max-height: 260px; overflow-y: auto; box-shadow: 0 6px 18px rgba(0,0,0,.45); }
.picker .pop.up { top: auto; bottom: calc(var(--h) + 2px); }
.picker .pop button { display: flex; align-items: center; gap: 8px; width: 100%; height: calc(var(--h) + 2px); padding: 0 10px; background: none; border: 0; text-align: left; white-space: nowrap; }
.picker .pop button + button { border-top: 1px solid var(--line); }

.note { position: absolute; left: 8px; right: 8px; bottom: 8px; height: calc(var(--h) + 8px); display: none; align-items: center; gap: 8px; padding: 0 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 4px 14px rgba(0,0,0,.4); }
.note.on { display: flex; }
.note span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.note.err span { color: var(--err); }
#sync { flex: none; font-style: normal; font-size: 13px; color: var(--sub); }
#sync[hidden] { display: none; }

#log div { display: flex; gap: 12px; padding: 8px 12px; border-bottom: 1px solid var(--line); color: var(--sub); font-size: .85em; white-space: nowrap; overflow: hidden; }
#log time { flex: none; width: 7em; }

.sheet { position: fixed; left: 0; right: 0; top: 0; height: var(--vh, 100%); background: rgba(0,0,0,.6); z-index: 30; display: flex; align-items: flex-end; justify-content: center; }
.sheet[hidden] { display: none; }
.sheet-in { width: 100%; max-width: 560px; max-height: 100%; overflow-y: auto; background: var(--bg); border-top: 1px solid var(--line); border-radius: 14px 14px 0 0; padding-bottom: 16px; }
/* 絵は幅いっぱいに大きく（衣装の違いを見るため）。× は絵に重ねず上に置く */
.sheet-top { display: flex; justify-content: center; position: relative; padding: 48px 12px 0; }
/* 小さい絵と同じく、ポケモンのいる真ん中下を拡大して見せる */
/* 下の入力欄が画面に収まるよう、写真は見えている高さの 36% まで */
/* 基準は svh（キーボードが出ても変わらない画面の高さ）。入力中も写真の大きさは変えない */
.sheet-top .pic { display: block; width: min(100%, 48vh); width: min(100%, 48svh); aspect-ratio: 4 / 3; overflow: hidden; border-radius: 10px; background: #222529; }
#zoom .sheet-top .pic { width: min(100%, calc((var(--vh, 100vh) - 90px) * 4 / 3)); }.sheet-top .pic img { width: 100%; height: 100%; display: block; transform: scale(1.4); transform-origin: 50% 72%; }
.sheet .x { position: absolute; right: 6px; top: 4px; width: 44px; height: 44px; border: 0; background: none; color: var(--sub); font-size: 26px; }
.sh-counts { padding: 8px 0 0; }
.cnt-row { display: flex; align-items: center; gap: 8px; padding: 4px 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* まとめる候補は1行に並べ、多ければ横に動かす（折り返さない） */
.sh-merge { display: flex; gap: 6px; align-items: center; padding: 0 12px; min-height: 46px; color: var(--sub); font-size: .85em; white-space: nowrap; overflow-x: auto; }
.sh-merge > * { flex: none; }
.sh-merge img { width: calc(var(--smw) + 8px); height: calc(var(--smh) + 6px); border-radius: 5px; cursor: pointer; border: 2px solid var(--line); }
.sh-merge img.sel { border-color: var(--on); }

</style>
</head>
<body>
<div id="app">
  <nav class="tabs" id="tabs">
    <button data-tab="scan" class="on">取り込み</button>
    <button data-tab="list">一覧</button>
    <button data-tab="settings">設定</button>
  </nav>
  <div class="loadbar" id="loadbar"><i></i></div>

  <!-- 一覧（検索もここ） -->
  <section class="page" id="page-list">
    <div class="bar">
      <input id="q" type="search" placeholder="ポケモン名" autocomplete="off">
      <div class="seg" id="filter">
        <button data-f="all" class="on">全部</button>
        <button data-f="a" class="pa">A×</button>
        <button data-f="b" class="pb">B×</button>
      </div>
    </div>
    <div class="vhead"><span class="th"></span><span class="nm"></span><span class="mkh pa">A</span><span class="mkh pb">B</span></div>
    <div class="scroll" id="list"></div>
  </section>

  <!-- 取り込み -->
  <section class="page on" id="page-scan">
    <div class="bar">
      <span class="who-q">誰のスクショ？</span>
      <div class="seg" id="who" title="押すと、その人のスクショを選ぶ（何枚でも）">
        <button data-p="a" class="on pa">A</button>
        <button data-p="b" class="pb">B</button>
      </div>
      <input id="files" type="file" accept="image/*" multiple hidden>
      <span class="grow"></span>
      <button class="btn main" id="add" disabled>追加</button>
    </div>
    <div class="progress" id="progress"><i></i></div>
    <div class="scroll" id="scan-list"></div>
  </section>

  <!-- 設定 -->
  <section class="page" id="page-settings">
    <!-- 名前の下に、その人の文字と写真の大きさ（10段階） -->
    <div class="bar people">
      <input id="name-a" maxlength="12" placeholder="1人目" title="1人目の名前">
      <input id="name-b" maxlength="12" placeholder="2人目" title="2人目の名前">
      <button class="btn main" id="save-names">保存</button>
      <input id="size-a" class="size pa-c" type="range" min="0" max="9" step="1" value="0" title="1人目の文字と写真の大きさ">
      <input id="size-b" class="size pb-c" type="range" min="0" max="9" step="1" value="0" title="2人目の文字と写真の大きさ">
      <div class="seg" id="me" title="この端末を使う人（その人の大きさで見せる）">
        <button data-p="a" class="pa">A</button>
        <button data-p="b" class="pb">B</button>
      </div>
    </div>
    <div class="scroll" id="log"></div>
  </section>

  <div class="note" id="note"><span id="note-text"></span><i id="sync" hidden>保存中</i></div>
</div>

<!-- 絵をたっぷり見る・種族を直す・まとめる -->
<div class="sheet" id="sheet" hidden>
  <div class="sheet-in">
    <div class="sheet-top"><span class="pic"><img id="sh-img" alt=""></span><button class="x" id="sh-close" title="閉じる">×</button></div>
    <div class="sh-counts" id="sh-counts" title="持っている数"></div>
    <div class="bar"><div class="picker grow" id="sh-picker"></div><input class="cos" id="sh-cos" type="text" maxlength="12" placeholder="衣装" autocomplete="off"><button class="btn main" id="sh-save">保存</button></div>
    <div class="sh-merge" id="sh-merge"></div>
  </div>
</div>

<!-- 写真だけを大きく見る（どこを押しても閉じる） -->
<div class="sheet" id="zoom" hidden>
  <div class="sheet-in">
    <div class="sheet-top"><span class="pic"><img id="zoom-img" alt=""></span><button class="x" title="閉じる">×</button></div>
  </div>
</div>

// スクショの読み取り（画面に触らない）。
// ポケモンGOの一覧は3列。名前の下の緑の線を目印にマスを探し、背景の黄色い玉でキラかを見分け、絵を切り抜く。
// 位置はすべて「画面の幅 W に対する割合」で決める（スマホごとに画像の大きさが違うため）。
window.KC = window.KC || {};
KC.scan = (() => {
  const COLS = [0.184, 0.5, 0.816];   // 3列の中心
  const ROW = 0.361;                  // 1段の高さ
  // 切り抜く絵の範囲（線の上端からの位置）
  const CROP = { dx: 0.12, top: 0.245, bottom: 0.065 };
  const IMG_W = 256, IMG_H = 192;     // 保存する絵の大きさ（大きく見てもぼやけないよう。元のスクショのマスとほぼ同じ）
  const FW = 48, FH = 36;             // 見比べるときの大きさ

  // 緑の線（約 110,236,185）
  const isBar = (r, g, b) => g > 200 && g - r > 70 && b > 140 && b < 220 && g - b > 25;

  // 線を探して、マス（列・線の高さ）の一覧を返す
  function findCells(d, W, H) {
    const segs = [];
    for (let y = 0; y < H; y++) {
      let s = -1;
      for (let x = 0; x <= W; x++) {
        const i = (y * W + x) * 4;
        const on = x < W && isBar(d[i], d[i + 1], d[i + 2]);
        if (on && s < 0) s = x;
        if (!on && s >= 0) { if (x - s > W * 0.08) segs.push([y, s, x]); s = -1; }
      }
    }
    const bars = [];
    for (const [y, s, e] of segs) {
      const c = (s + e) / 2;
      const f = bars.find(q => Math.abs(q.c - c) < W * 0.05 && y - q.y1 <= 2);
      if (f) f.y1 = y; else bars.push({ y0: y, y1: y, c });
    }
    // 同じ段の線をまとめる。線がボタンに隠れた列も、段があればマスとして調べる
    const rows = [];
    for (const b of bars) {
      const r = rows.find(q => Math.abs(q.y - b.y0) < W * 0.03);
      if (r) r.y = Math.min(r.y, b.y0); else rows.push({ y: b.y0 });
    }
    rows.sort((a, b) => a.y - b.y);
    const cells = [];
    for (const r of rows) {
      if (r.y - W * (CROP.top + 0.02) < 0) continue;   // 絵が上で切れている段は飛ばす
      COLS.forEach((cx, col) => cells.push({ col, cx: cx * W, by: r.y }));
    }
    return cells;
  }

  // 背景の黄色い玉（左上と右上の大きな玉）の場所で、黄色っぽい点の割合を測る
  function yellowRatio(d, W, H, cx, cy, rr) {
    let n = 0, t = 0;
    for (let y = Math.round(cy - rr); y <= cy + rr; y++) {
      for (let x = Math.round(cx - rr); x <= cx + rr; x++) {
        if ((x - cx) ** 2 + (y - cy) ** 2 > rr * rr || x < 0 || y < 0 || x >= W || y >= H) continue;
        t++;
        const i = (y * W + x) * 4;
        if (d[i] > 215 && d[i + 1] > 160 && d[i] - d[i + 2] > 45) n++;
      }
    }
    return t ? n / t : 0;
  }
  function isLucky(d, W, H, cell) {
    const r = W * 0.02;
    const a = yellowRatio(d, W, H, cell.cx - 0.069 * W, cell.by - 0.2 * W, r);
    const b = yellowRatio(d, W, H, cell.cx + 0.071 * W, cell.by - 0.184 * W, r);
    return a > 0.5 && b > 0.4;
  }

  // マスの絵を IMG_W×IMG_H に切り抜いた canvas
  function cropCell(src, W, cell) {
    const c = document.createElement('canvas');
    c.width = IMG_W; c.height = IMG_H;
    const g = c.getContext('2d');
    g.imageSmoothingQuality = 'high';
    const sx = cell.cx - CROP.dx * W, sy = cell.by - CROP.top * W;
    const sw = CROP.dx * 2 * W, sh = (CROP.top - CROP.bottom) * W;
    g.drawImage(src, sx, sy, sw, sh, 0, 0, IMG_W, IMG_H);
    return c;
  }
  // 名前の部分（文字読み取りのヒント用）
  function cropName(src, W, cell) {
    const sw = 0.31 * W, sh = 0.05 * W;
    const c = document.createElement('canvas');
    c.width = Math.round(sw); c.height = Math.round(sh);
    c.getContext('2d').drawImage(src, cell.cx - sw / 2, cell.by - 0.058 * W, sw, sh, 0, 0, c.width, c.height);
    return c;
  }

  // 見比べ用の特徴（FW×FH の色）。右上のお気に入りの星は付いたり付かなかったりするので使わない
  function feature(canvasOrImg) {
    const c = document.createElement('canvas');
    c.width = FW; c.height = FH;
    const g = c.getContext('2d', { willReadFrequently: true });
    g.imageSmoothingQuality = 'high';

  const MASK = (() => {
    const m = new Uint8Array(FW * FH);
    for (let y = 0; y < FH; y++) for (let x = 0; x < FW; x++) m[y * FW + x] = (x > FW * 0.72 && y < FH * 0.22) ? 0 : 1;
    return m;
  })();
  const diff3 = (a, i, b, j) => Math.abs(a[i] - b[j]) + Math.abs(a[i + 1] - b[j + 1]) + Math.abs(a[i + 2] - b[j + 2]);
  // キラの背景（黄色い玉）の見本。bg.js で KC.BG（FW×FH×3）を入れる。無ければ背景を区別しない

    return BG;
  };
  // 背景と違う点（ポケモン本体）の印
  function foreground(f) {
    const t = bg(), m = new Uint8Array(FW * FH);
    for (let p = 0; p < FW * FH; p++) m[p] = MASK[p] && (!t || diff3(f, p * 3, t, p * 3) > 70) ? 1 : 0;
    return m;
  }
  // 2つの絵の違い（0 = 同じ、1 = 全部違う）。本体の点のうち、色がはっきり違う点の割合。
  // 少しのずれは許すため、上下左右1マスずらした中で一番小さい値
  function distance(a, b) {
    const ma = a.fg || (a.fg = foreground(a)), mb = b.fg || (b.fg = foreground(b));
    let best = Infinity;
    for (let oy = -1; oy <= 1; oy++) {
      for (let ox = -1; ox <= 1; ox++) {
        let s = 0, n = 0;
        for (let y = 1; y < FH - 1; y++) {
          for (let x = 1; x < FW - 1; x++) {
            const p = y * FW + x, q = (y + oy) * FW + x + ox;
            if (!ma[p] && !mb[q]) continue;
            n++;
            if (diff3(a, p * 3, b, q * 3) > 70) s++;
          }
        }
        best = Math.min(best, n ? s / n : 0);
      }
    }
    return best;
  }
  // 試しのスクショでは、同じ絵は 0.1 以下、別の衣装は 0.3 以上（2026-11-05 測定）
  const SAME = 0.2;    // これより小さければ同じ絵とみなす
  const NEAR = 0.45;   // これより小さければ候補として先に出す

  // 1枚のスクショを読む → [{lucky, canvas, nameCanvas, col, by}]
  async function readImage(blob) {
    const im = await createImageBitmap(blob);
    const W = im.width, H = im.height;
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const g = c.getContext('2d', { willReadFrequently: true });
    g.drawImage(im, 0, 0);
    const d = g.getImageData(0, 0, W, H).data;
    const out = [];
    for (const cell of findCells(d, W, H)) {
      out.push({ ...cell, lucky: isLucky(d, W, H, cell), canvas: cropCell(c, W, cell), nameCanvas: cropName(c, W, cell) });
    }
    im.close && im.close();
    return out;
  }

  return { findCells, isLucky, readImage, feature, distance, foreground, SAME, NEAR, IMG_W, IMG_H, FW, FH };
})();

// 名前の文字を読んで、種族の候補を出す（ヒント用。読めなくても困らない作り）。
// 文字読み取りは無料の Tesseract.js を、必要になったときだけ読み込む。
window.KC = window.KC || {};
KC.ocr = (() => {
  const LIB = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
  let workerP = null;

  function loadLib() {
    if (window.Tesseract) return Promise.resolve();
    return new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = LIB; s.onload = res; s.onerror = () => rej(new Error('文字読み取りの部品を読み込めませんでした'));
      document.head.appendChild(s);
    });
  }
  function worker() {
    if (!workerP) {
      workerP = loadLib().then(() => Tesseract.createWorker('jpn')).catch(e => { workerP = null; throw e; });
    }
    return workerP;
  }

  // 文字を読みやすく：2倍に広げて白黒にする（名前は灰色の字、背景は明るい）
  function prep(src) {
    const c = document.createElement('canvas');
    c.width = src.width * 2; c.height = src.height * 2;
    const g = c.getContext('2d', { willReadFrequently: true });
    g.drawImage(src, 0, 0, c.width, c.height);
    const im = g.getImageData(0, 0, c.width, c.height), d = im.data;
    for (let i = 0; i < d.length; i += 4) {
      const v = (d[i] + d[i + 1] + d[i + 2]) / 3 < 150 ? 0 : 255;
      d[i] = d[i + 1] = d[i + 2] = v;
    }
    g.putImageData(im, 0, 0);
    return c;
  }

  // 比べやすい形にする：カタカナとー以外を消し（♂♀はひらがなに読み違えやすいので消える）、
  // 濁点・半濁点と小さい字を区別しない（読み取りでよく取り違えるため）
  const SMALL = { 'ァ': 'ア', 'ィ': 'イ', 'ゥ': 'ウ', 'ェ': 'エ', 'ォ': 'オ', 'ッ': 'ツ', 'ャ': 'ヤ', 'ュ': 'ユ', 'ョ': 'ヨ', 'ヮ': 'ワ' };
  function norm(s) {
    return String(s || '').replace(/[^ァ-ヺー]/g, '')
      .normalize('NFD').replace(/[゙゚]/g, '')
      .replace(/[ァィゥェォッャュョヮ]/g, ch => SMALL[ch]);
  }
  // 入力欄で名前を探す用（ひらがなもカタカナにしてから比べる）
  const kana = s => String(s || '').replace(/[ぁ-ゖ]/g, ch => String.fromCharCode(ch.charCodeAt(0) + 0x60));
  function lev(a, b) {
    const m = a.length, n = b.length, d = Array.from({ length: m + 1 }, (_, i) => [i]);
    for (let j = 1; j <= n; j++) d[0][j] = j;
    for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) {
      d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
    return d[m][n];
  }
  let NORM = null;
  // 読んだ文字 → 種族の図鑑番号の候補（よく合う順・最大5つ）。
  // sure：名前がそのまま読めて1つに決まったとき（最初から入れておいてよい）
  function guessEx(text) {
    const t = norm(text);
    if (t.length < 2) return { ids: [], sure: false };
    NORM = NORM || KC.NAMES.map(norm);
    const ids = test => NORM.map((n, i) => test(n) ? i + 1 : 0).filter(Boolean);
    // 1) そのまま同じ
    const hit = ids(n => n === t);
    if (hit.length) return { ids: hit.slice(0, 5), sure: hit.length === 1 };
    // 2) 名前のうしろに余分な字（性別・数字の読み違い）が付いている → 一番長く合う名前
    const pre = ids(n => n.length >= 3 && t.startsWith(n));
    if (pre.length) {
      const L = Math.max(...pre.map(i => NORM[i - 1].length));
      const best = pre.filter(i => NORM[i - 1].length === L);
      return { ids: best.slice(0, 5), sure: best.length === 1 };
    }
    return { ids: fuzzy(t), sure: false };
  }
  const guess = text => guessEx(text).ids;
  function fuzzy(t) {
    // 3) 「リザ」のような短いニックネーム → 頭が合う名前（短い順）／4) 少し違う名前
    const sc = [];
    NORM.forEach((n, i) => {
      const head = n.startsWith(t) ? 0.3 + n.length / 100 : 9;
      const r = Math.min(head, lev(t, n) / Math.max(t.length, n.length));
      if (r <= 0.4) sc.push([r, i + 1]);
    });
    return sc.sort((a, b) => a[0] - b[0]).slice(0, 5).map(x => x[1]);
  }
  // 入力欄の候補：ひらがな・カタカナどちらでも、頭が合う名前→途中に含む名前
  function search(q, max = 8) {
    const t = kana(q).trim();
    if (!t) return [];
    const a = [], b = [];
    KC.NAMES.forEach((n, i) => { if (n.startsWith(t)) a.push(i + 1); else if (n.includes(t)) b.push(i + 1); });
    return [...a, ...b].slice(0, max);
  }

  // canvas の一覧を読む → 文字の一覧（失敗したら空の文字）
  async function readAll(canvases, onProgress) {
    let w;
    try { w = await worker(); } catch { return canvases.map(() => ''); }
    const out = [];
    for (let i = 0; i < canvases.length; i++) {
      try { out.push((await w.recognize(prep(canvases[i]))).data.text.trim()); } catch { out.push(''); }
      onProgress && onProgress(i + 1, canvases.length);
    }
    return out;
  }

  return { readAll, guess, guessEx, search, norm };
})();

// Google 側とのやりとりと、手元に持つデータ（state）。
// 絵は一度もらったら変わらないので、端末の localStorage に覚えておき、次からはもらわない。
window.KC = window.KC || {};
KC.api = (() => {
  // owned：人ごとの Map（絵の id → 持っている数）
  // gender：人ごとの Map（絵の id → 'm'|'f'|'mf'。どちらのキラを持っているか。記録した絵だけ）
  // sizes：2人の文字の大きさ（0〜9）
  const state = { people: ['A', 'B'], sizes: [0, 0], variants: new Map(), owned: { a: new Map(), b: new Map() }, gender: { a: new Map(), b: new Map() }, log: [] };
  const imgs = new Map();      // id → 絵（data URL）
  const feats = new Map();     // id → 見比べ用の特徴

  // 保存場所（Google のウェブアプリ）の URL。家族に送るリンクの「#」のあとに入っている
  //（#AKfy… でも #https://script.google.com/macros/s/AKfy…/exec でもよい）。一度来たら端末に覚える
  const KEY = 'kc-gas';
  function gasUrl() {
    if (window.KC_GAS_URL) return window.KC_GAS_URL;   // 試し版（にせ Google）
    let h = '';
    try { h = decodeURIComponent(location.hash.slice(1)).trim(); } catch { /* 変な # は無視 */ }
    const m = h.match(/^(?:https:\/\/script\.google\.com\/macros\/s\/)?([\w-]{20,})(?:\/exec)?\/?$/);
    let id = m ? m[1] : null;
    try {
      if (id) localStorage.setItem(KEY, id);
      else id = localStorage.getItem(KEY);
    } catch { /* 覚えられない端末でも # があれば動く */ }
    if (!id) throw new Error('リンクの # のあとに Google の URL がありません');
    return `https://script.google.com/macros/s/${id}/exec`;
  }

  // Google を呼ぶ。中身を文字（text/plain）で送ると、ブラウザの事前確認なしで別のサイトへ送れる。
  // 電波の途切れ・Google が混んでいる時などの一時的な失敗は、少し待って2回までやり直す
  //（Google 側の変える操作は、同じものを2回送っても結果が同じになる作り）
  const retryable = msg => (e => { e.retry = true; return e; })(new Error(msg));
  const TEMP = /ロック|lock|サーバー|server|多すぎ|too many|しばらく|timed? ?out|タイムアウト|内部エラー|internal/i;
  async function callOnce(url, body) {
    let r, t;
    try {
      r = await fetch(url, { method: 'POST', body });
      t = await r.text();
    } catch (e) {
      throw retryable('Google につながりません（電波が弱いか、途中で画面を離れた）');
    }
    if (!r.ok) throw retryable('Google が答えませんでした（' + r.status + '）');
    let j;
    try { j = JSON.parse(t); } catch { throw retryable('Google から返事が崩れて届きました（混んでいる時など）'); }
    if (!j.ok) throw TEMP.test(j.e) ? retryable('Google が混んでいました（' + j.e + '）') : new Error(j.e);
    return j.v;
  }
  async function call(name, ...args) {
    const url = gasUrl(), body = JSON.stringify({ f: name, a: args });
    for (let i = 0; ; i++) {
      try { return await callOnce(url, body); } catch (e) {
        if (!e.retry || i >= 2) throw e;
        await new Promise(res => setTimeout(res, 1500 * (i + 1)));
      }
    }
  }

  // 一覧・名前・持っている、の中身を1つの文字にする（Google の答えと手元が同じかを比べるため）
  const sig = () => JSON.stringify([state.people, state.sizes, [...state.variants.values()].map(v => [v.id, v.no, v.cos]).sort(),
    [...state.owned.a].sort(), [...state.owned.b].sort(), [...state.gender.a].sort(), [...state.gender.b].sort()]);
  // Google の {id: 数}（前の版は id の並び）を Map にする
  const toMap = o => Array.isArray(o) ? new Map(o.map(id => [id, 1])) : new Map(Object.entries(o || {}));
  // Google の一覧で手元を置きかえる。返す値：記録以外が変わったか
  function setMeta(m) {
    const before = sig();
    state.people = m.people;
    state.sizes = (m.sizes || [0, 0]).map(Number);
    state.variants = new Map(m.variants.map(([id, no, cos]) => [id, { id, no, cos: cos || '' }]));
    state.owned = { a: toMap(m.owned.a), b: toMap(m.owned.b) };
    const g = m.gender || {};   // 前の版の Google には無い
    state.gender = { a: new Map(Object.entries(g.a || {})), b: new Map(Object.entries(g.b || {})) };
    state.log = m.log;
    return sig() !== before;
  }
  const load = async () => setMeta(await call('api_meta'));

  // 絵の覚え場所（IndexedDB。localStorage より多く入る）。使えない端末では毎回もらう
  let dbp = null;
  function idb() {
    if (!dbp) {
      dbp = new Promise(res => {
        try {
          const r = indexedDB.open('kira-check', 1);
          r.onupgradeneeded = () => r.result.createObjectStore('img');
          r.onsuccess = () => res(r.result);
          r.onerror = () => res(null);
        } catch { res(null); }
      });
    }
    return dbp;
  }
  async function idbGet(ids) {
    const db = await idb();
    if (!db || !ids.length) return;
    await new Promise(res => {
      try {
        const st = db.transaction('img').objectStore('img');
        let left = ids.length;
        ids.forEach(id => {
          const q = st.get(id);
          q.onsuccess = () => { if (q.result) imgs.set(id, q.result); if (!--left) res(); };
          q.onerror = () => { if (!--left) res(); };
        });
      } catch { res(); }
    });
  }
  async function idbPut(pairs) {
    const db = await idb();
    if (!db || !pairs.length) return;
    try {
      const st = db.transaction('img', 'readwrite').objectStore('img');
      pairs.forEach(([id, v]) => st.put(v, id));
    } catch { /* いっぱいなら覚えない */ }
  }

  // 足りない絵をそろえる（端末の覚え場所 → 無ければ Google からまとめてもらう）
  async function fetchImages(ids) {
    await idbGet(ids.filter(id => !imgs.has(id)));
    const need = ids.filter(id => !imgs.has(id));
    for (let i = 0; i < need.length; i += 80) {
      const got = Object.entries(await call('api_images', need.slice(i, i + 80)));
      got.forEach(([id, v]) => imgs.set(id, v));
      await idbPut(got);
    }
  }
  const img = id => imgs.get(id) || '';
  function remember(id, dataUrl) {
    imgs.set(id, dataUrl);
    idbPut([[id, dataUrl]]);
  }

  // 絵の特徴（見比べ用）。絵を読み込んでから計算する
  async function feature(id) {
    if (feats.has(id)) return feats.get(id);
    const src = img(id);
    if (!src) return null;
    const im = new Image();
    im.src = src;
    await im.decode();
    const f = KC.scan.feature(im);
    feats.set(id, f);
    return f;
  }

  // ---- 変える操作 ----
  // 手元の state をすぐ変えて画面に出し、Google へは裏で1つずつ順番に送る（待たせないため）。
  // 送るものが全部終わったら、Google の一覧で手元を合わせる。失敗したら残りは送らず、Google の中身に戻す
  const hooks = { busy() {}, synced() {}, failed() {} };   // ui.js が中身を入れる
  let chain = Promise.resolve(), pending = 0, broken = false, last = null;
  function push(name, ...args) {
    pending++;
    hooks.busy(true);
    const job = chain.then(async () => {
      if (broken) return;
      const r = await call(name, ...args);
      last = r.meta || r;
    });
    chain = job.catch(e => { if (!broken) { broken = true; hooks.failed(e); } }).then(async () => {
      if (--pending) return;
      let changed = true;
      try {
        if (broken) { broken = false; setMeta(await call('api_meta')); }
        else if (last) changed = setMeta(last);
      } catch { /* 合わせられなくても手元のまま */ }
      last = null;
      hooks.synced(changed);
      hooks.busy(pending > 0);
    });
    return job;
  }
  const isBusy = () => pending > 0;

  // 画面と同じ決まりで文字を整える（Code.gs の kcText_ と同じ）
  const clean = (s, max = 12) => String(s == null ? '' : s).trim().replace(/^[=+\-@]+/, '').slice(0, max);
  const newId = () => 'v' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

  // items：[{vid, n}]（台帳の絵）か [{no, img, cos, n}]（新しい絵）。n は数えた匹数（今より多いときだけ増やす）
  // 返す値：{ids（items と同じ順）, added（数が増えた絵）}
  function add(p, items) {
    const ids = [], added = [], send = [];
    items.forEach(it => {
      let vid = it.vid;
      const n = Math.max(1, it.n || 1);
      if (vid) send.push({ vid, n });
      else {
        vid = newId();
        const cos = clean(it.cos);
        state.variants.set(vid, { id: vid, no: it.no, cos });
        remember(vid, it.img);
        send.push({ id: vid, no: it.no, img: it.img, cos, n });
      }
      ids.push(vid);
      if (n > (state.owned[p].get(vid) || 0)) { state.owned[p].set(vid, n); if (!added.includes(vid)) added.push(vid); }
    });
    push('api_add', p, send);
    return { ids, added };
  }
  // 持っている数を直す（0 で持っていない）
  function count(p, vid, n) {
    n = Math.max(0, n);
    if (n) state.owned[p].set(vid, n); else { state.owned[p].delete(vid); state.gender[p].delete(vid); }   // 0 にすると行ごと消える
    push('api_count', p, vid, n);
  }
  const have = (p, vid) => state.owned[p].get(vid) || 0;
  // オスメス（'m'|'f'|'mf'|''）。持っている絵だけ記録できる
  const gender = (p, vid) => state.gender[p].get(vid) || '';
  function setGender(p, vid, g) {
    if (!have(p, vid)) return;
    if (g) state.gender[p].set(vid, g); else state.gender[p].delete(vid);
    push('api_gender', p, vid, g);
  }
  const total = p => [...state.owned[p].values()].reduce((a, b) => a + b, 0);
  function edit(vid, no, cos) {
    const v = state.variants.get(vid);
    if (!v) return;
    v.no = no;
    v.cos = clean(cos);
    push('api_edit', vid, no, v.cos);
  }
  function merge(from, into) {
    // 両方持っていた人は多い方の数（Code.gs と同じ）
    // オスメスは両方の印を合わせる
    ['a', 'b'].forEach(p => {
      const n = have(p, from);
      if (n && state.owned[p].delete(from)) state.owned[p].set(into, Math.max(n, have(p, into)));
      const g = gender(p, from) + gender(p, into);
      state.gender[p].delete(from);
      if (g) state.gender[p].set(into, (g.includes('m') ? 'm' : '') + (g.includes('f') ? 'f' : ''));
    });
    state.variants.delete(from);
    feats.delete(from);
    push('api_merge', from, into);
  }
  function setPeople(names) {
    state.people = [0, 1].map(i => clean(names[i]) || 'AB'[i]);
    push('api_people', names);
  }

  function setSize(p, k) {
    state.sizes[p === 'a' ? 0 : 1] = k;
    push('api_size', p, k);
  }

  return { state, hooks, load, isBusy, fetchImages, img, remember, feature, add, count, have, gender, setGender, total, edit, merge, setPeople, setSize };
})();

// 画面の共通部分：タブ・下の帯（前→今・保存中）・種族を選ぶ欄・設定・起動
window.KC = window.KC || {};
KC.ui = (() => {
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const name = no => KC.NAMES[no - 1] || '?';
  const label = v => v ? name(v.no) + (v.cos ? ' ' + v.cos : '') : '?';   // 種族名＋衣装名
  const S = () => KC.api.state;

  // キーボードが出ても入力欄が隠れないように：
  // 画面の高さを「見えている部分」に合わせ、iPhone が勝手に窓ごと動かした分は戻す
  function fitKeyboard() {
    const vv = window.visualViewport;
    const fit = () => {
      if (vv) document.documentElement.style.setProperty('--vh', Math.round(vv.height) + 'px');
      if (window.scrollY) window.scrollTo(0, 0);
      const a = document.activeElement;
      if (a && a._place) a._place();
    };
    if (vv) { vv.addEventListener('resize', fit); vv.addEventListener('scroll', fit); }
    window.addEventListener('scroll', fit);
    // 一覧の中の入力欄に入ったら、その行を一覧の上の方へ動かす（下に候補とキーボードの場所を空ける）
    document.addEventListener('focusin', e => {
      // 大きく見る画面の入力欄：欄が見える所まで動かす（写真の大きさは変えない）
      const sh = e.target.closest('input') && e.target.closest('.sheet');
      if (sh) {
        const go = () => e.target.scrollIntoView({ block: 'nearest' });
        go();
        setTimeout(go, 350);   // キーボードが出終わってからもう一度
        return;
      }
      const box = e.target.closest('input') && e.target.closest('.scroll');
      if (!box) return;
      box.classList.add('typing');
      const row = e.target.closest('.srow') || e.target;
      const go = () => { box.scrollTop += row.getBoundingClientRect().top - box.getBoundingClientRect().top - 4; };
      go();
      setTimeout(go, 350);   // キーボードが出終わってからもう一度
    });
    document.addEventListener('focusout', e => {
      const box = e.target.closest('.scroll');
      if (box) setTimeout(() => { if (!box.contains(document.activeElement)) box.classList.remove('typing'); }, 150);
    });
  }

  // 指2本・ダブルタップで拡大させない（iPhone は viewport の指定だけでは止まらない）
  function noZoom() {
    ['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
    document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
    let last = 0;
    document.addEventListener('touchend', e => {
      const now = Date.now();
      if (now - last < 300 && !e.target.closest('input')) e.preventDefault();
      last = now;
    }, { passive: false });
  }

  function tabs() {
    $('tabs').addEventListener('click', e => {
      const b = e.target.closest('button[data-tab]');
      if (!b) return;
      document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x === b));
      document.querySelectorAll('.page').forEach(p => p.classList.toggle('on', p.id === 'page-' + b.dataset.tab));
    });
  }

  // 下の帯：最後にしたこと（前→今）。次の操作まで出しておく
  function note(text, err) {
    $('note-text').textContent = text;
    $('note').classList.add('on');
    $('note').classList.toggle('err', !!err);
  }
  function fail(e) { note('できませんでした：' + ((e && e.message) || e), true); }
  // 待っている間：上の細い線が流れ、下の帯に「保存中」
  let loading = 0;
  function showBusy() {
    const on = loading > 0 || KC.api.isBusy();
    $('loadbar').classList.toggle('busy', on);
    $('sync').hidden = !KC.api.isBusy();
  }
  async function busy(fn) {
    loading++;
    showBusy();
    try { return await fn(); } catch (e) { fail(e); return null; } finally { loading--; showBusy(); }
  }
  function hooks() {
    const h = KC.api.hooks;
    h.busy = () => {
      showBusy();
      if (KC.api.isBusy() && !$('note').classList.contains('on')) note('');
    };
    h.failed = e => note('保存できませんでした（Google の中身に戻します）：' + ((e && e.message) || e), true);
    // 送り終わって、Google の中身が手元と違った（もう1人が変えた・失敗した）ときだけ描き直す
    h.synced = async changed => {
      if (!changed) { log(); return; }
      refresh();
      await KC.api.fetchImages([...S().variants.keys()]).catch(() => {});
      fillImages();
    };
    // 送り終わる前に閉じようとしたら聞く
    window.addEventListener('beforeunload', e => { if (KC.api.isBusy()) { e.preventDefault(); e.returnValue = ''; } });
  }

  // 2人の名前を画面のあちこちに入れる
  function names() {
    const [a, b] = S().people;
    document.querySelectorAll('.pa').forEach(el => { el.textContent = el.closest('#filter') ? a + '×' : a; el.title = a; });
    document.querySelectorAll('.pb').forEach(el => { el.textContent = el.closest('#filter') ? b + '×' : b; el.title = b; });
    if (document.activeElement !== $('name-a')) $('name-a').value = a;
    if (document.activeElement !== $('name-b')) $('name-b').value = b;
    ['a', 'b'].forEach((p, i) => { if (document.activeElement !== $('size-' + p)) $('size-' + p).value = S().sizes[i]; });
    applySize();
  }
  const pname = p => S().people[p === 'a' ? 0 : 1];

  function log() {
    const f = t => { const d = new Date(t); return isNaN(d) ? '' : `${d.getMonth() + 1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`; };
    $('log').innerHTML = S().log.map(([t, s]) => `<div><time>${f(t)}</time><span>${esc(s)}</span></div>`).join('');
  }

  // 絵の src を、手元にある分だけ入れる
  function fillImages(root = document) {
    root.querySelectorAll('img[data-vid]').forEach(im => {
      if (im.getAttribute('src')) return;
      const v = KC.api.img(im.dataset.vid);
      if (v) im.src = v;
    });
  }

  // 種族を選ぶ欄。cands()：入力が空のときの候補 [{vid}|{no}]。onChange(sel)：sel は {no, vid?} か null
  function picker(host, { cands = () => [], onChange = () => {}, value = null } = {}) {
    host.innerHTML = '<input type="text" autocomplete="off" placeholder="種族"><div class="pop" hidden></div>';
    const inp = host.querySelector('input'), pop = host.querySelector('.pop');
    let sel = value;
    const show = () => {
      const q = inp.value.trim();
      let list;
      if (!q || (sel && q === name(sel.no))) list = cands();
      else {
        const nos = KC.ocr.search(q, 8);
        list = nos.map(no => ({ no }));
        // 1番目の種族に台帳の絵があれば、その絵も出す（同じ絵ならそれを選べる）
        if (nos.length) for (const v of S().variants.values()) if (v.no === nos[0]) list.push({ vid: v.id, no: v.no });
      }
      pop.innerHTML = list.map(c => c.vid
        ? `<button data-vid="${esc(c.vid)}" data-no="${c.no}"><span class="th sm"><img data-vid="${esc(c.vid)}" alt=""></span>${esc(label(S().variants.get(c.vid) || c))}</button>`
        : `<button data-no="${c.no}">${esc(name(c.no))}</button>`).join('');
      fillImages(pop);
      pop.hidden = !list.length;
      place();
    };
    // 候補は、下に場所があれば下、無ければ上に出す（キーボードに隠れないように）
    const place = () => {
      if (pop.hidden) return;
      const r = inp.getBoundingClientRect(), vh = window.visualViewport ? window.visualViewport.height : innerHeight;
      const below = vh - r.bottom - 6, above = r.top - 6;
      const up = below < 170 && above > below;
      pop.classList.toggle('up', up);
      pop.style.maxHeight = Math.max(84, Math.min(260, up ? above : below)) + 'px';
    };
    inp._place = place;
    const set = (s, quiet) => {
      sel = s;
      inp.value = s ? name(s.no) : '';
      host.classList.toggle('vid', !!(s && s.vid));
      if (!quiet) onChange(sel);
    };
    inp.addEventListener('focus', show);
    inp.addEventListener('input', () => {
      // 名前をそのまま打ち終えたら、それを選んだことにする
      const i = KC.NAMES.indexOf(inp.value.trim());
      sel = i >= 0 ? { no: i + 1 } : null;
      onChange(sel);
      show();
    });
    inp.addEventListener('blur', () => setTimeout(() => { pop.hidden = true; }, 120));
    pop.addEventListener('pointerdown', e => e.preventDefault());   // 入力欄のフォーカスを外さない
    pop.addEventListener('click', e => {
      const b = e.target.closest('button');
      if (!b) return;
      set(b.dataset.vid ? { vid: b.dataset.vid, no: +b.dataset.no } : { no: +b.dataset.no });
      pop.hidden = true;
      inp.blur();
    });
    set(value, true);
    return { get: () => sel, set };
  }

  // 数の −／＋（押したときの処理は使う側で button[data-d] を拾う）
  const stepHtml = (n, tip = '') => `<span class="step"${tip ? ` title="${esc(tip)}"` : ''}><button data-d="-1"${n ? '' : ' disabled'}>−</button><b>${n}</b><button data-d="1">＋</button></span>`;

  // 写真だけを大きく見る（取り込みの表で使う。どこを押しても閉じる）
  function zoom(src) {
    if (!src) return;
    $('zoom-img').src = src;
    $('zoom').hidden = false;
  }

  // 文字と写真の大きさ（老眼向け）：0〜9 の10段階。人ごとに Google に覚え、この端末を使う人（設定で選ぶ・端末に覚える）の大きさで見せる。
  // 倍率は 1.0〜1.6。1 以上は行を2段にする（data-big）。起動の一瞬も同じ大きさにするため端末にも控える
  const SIZE_KEY = 'kc-size', ME_KEY = 'kc-me';
  // まだ選んでいない端末は、前の版で使っていた「誰のスクショ？」の人
  let me = 'a';
  try { me = (localStorage.getItem(ME_KEY) || localStorage.getItem('kc-who')) === 'b' ? 'b' : 'a'; } catch { /* 覚えられなければ1人目 */ }
  function paintMe() { $('me').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.p === me)); }
  function applySize(k) {
    if (k == null) k = S().sizes[me === 'b' ? 1 : 0];
    k = Math.min(9, Math.max(0, Math.floor(+k) || 0));
    const r = document.documentElement;
    r.style.setProperty('--s', (1 + k * 0.6 / 9).toFixed(3));
    if (k) r.dataset.big = ''; else delete r.dataset.big;
    try { localStorage.setItem(SIZE_KEY, k); } catch { /* 覚えられない端末でもその場は効く */ }
  }

  function settings() {
    try { applySize(localStorage.getItem(SIZE_KEY) || 0); } catch { applySize(0); }
    // この端末を使う人：押すとその人の大きさになる（端末に覚える）
    paintMe();
    $('me').addEventListener('click', e => {
      const b = e.target.closest('button');
      if (!b || b.dataset.p === me) return;
      const before = me;
      me = b.dataset.p;
      try { localStorage.setItem(ME_KEY, me); } catch { /* その場だけ */ }
      paintMe();
      applySize();
      note(`この端末：${pname(before)}→${pname(me)}`);
    });
    // バーを動かしている間はその場で見せ、離したら保存（前→今を帯に出す）
    ['a', 'b'].forEach(p => {
      const el = $('size-' + p);
      el.addEventListener('input', () => { if (me === p) applySize(el.value); });
      el.addEventListener('change', () => {
        const k = +el.value, before = S().sizes[p === 'a' ? 0 : 1];
        if (k === before) return;
        KC.api.setSize(p, k);
        applySize();
        note(`${pname(p)}：大きさ ${before + 1}→${k + 1}`);
      });
    });
    $('zoom').addEventListener('click', () => { $('zoom').hidden = true; });
    $('save-names').addEventListener('click', () => {
      const before = S().people.join('・');
      KC.api.setPeople([$('name-a').value, $('name-b').value]);
      refresh();
      note(`名前：${before} → ${S().people.join('・')}`);
    });
  }

  // 一覧・名前・記録を描き直す
  function refresh() {
    names();
    log();
    KC.list.render();
    KC.scanUi.render();
  }

  async function boot() {
    noZoom();
    fitKeyboard();
    tabs();
    hooks();
    settings();
    KC.list.init();
    KC.scanUi.init();
    await busy(async () => {
      await KC.api.load();
      refresh();
      await KC.api.fetchImages([...S().variants.keys()]);
      fillImages();
    });
  }

  return { $, esc, name, label, pname, note, fail, busy, fillImages, picker, stepHtml, zoom, applySize, refresh, boot };
})();

// 一覧の画面（検索もここ）と、絵をたっぷり見る画面（種族を直す・同じ絵をまとめる）
window.KC = window.KC || {};
KC.list = (() => {
  const U = () => KC.ui;
  const S = () => KC.api.state;
  let filter = 'all';

  // 印：持っていない ×・持っていれば数（1・2・3…）
  const mkText = n => n ? String(n) : '×';
  // オスメスの記号（︎：iPhone などで絵文字の形にしないための印）
  const SYM = { m: '♂︎', f: '♀︎' };
  const gSym = g => (g.includes('m') ? SYM.m : '') + (g.includes('f') ? SYM.f : '');
  const gText = g => gSym(g) || '−';
  // 印の数の横に、記録したオスメスを小さく出す
  const mkHtml = (v, p) => {
    const n = KC.api.have(p, v.id), g = n ? gSym(KC.api.gender(p, v.id)) : '';
    return `<button class="mk${n ? ' on' : ''}" data-p="${p}">${mkText(n)}${g ? `<small>${g}</small>` : ''}</button>`;
  };
  function rowHtml(v) {
    const { esc, name } = U();
    return `<div class="vrow" data-vid="${esc(v.id)}"><span class="th"><img data-vid="${esc(v.id)}" alt=""></span>` +
      `<span class="nm">${esc(name(v.no))}${v.cos ? `<small>${esc(v.cos)}</small>` : ''}</span>${mkHtml(v, 'a')}${mkHtml(v, 'b')}</div>`;
  }

  function render() {
    const { $, esc, name, fillImages } = U();
    const q = $('q').value.trim();
    const hitNos = q ? new Set(KC.ocr.search(q, 60)) : null;
    const o = S().owned;
    const vs = [...S().variants.values()]
      .filter(v => !hitNos || hitNos.has(v.no) || (v.cos && v.cos.includes(q)))
      .filter(v => filter === 'all' || !o[filter].has(v.id))
      .sort((a, b) => a.no - b.no || (a.id < b.id ? -1 : 1));
    let html = vs.map(rowHtml).join('');
    // 検索した種族で、台帳に絵がないもの（まだ誰もキラを持っていない）
    if (hitNos && filter === 'all') {
      const has = new Set(vs.map(v => v.no));
      html += [...hitNos].filter(no => !has.has(no)).slice(0, 20)
        .map(no => `<div class="vrow none"><span class="th"></span><span class="nm">${esc(name(no))}</span><button class="mk" disabled>×</button><button class="mk" disabled>×</button></div>`).join('');
    }
    $('list').innerHTML = html;
    fillImages($('list'));
  }

  // 1行の印だけ描き直す（一覧全体を描き直すと絵の読み直しで遅い）
  function paintRow(vid) {
    const row = U().$('list').querySelector(`.vrow[data-vid="${CSS.escape(vid)}"]`), v = S().variants.get(vid);
    if (!row || !v) return;
    if (filter !== 'all' && S().owned[filter].has(vid)) { row.remove(); return; }   // 絞り込みの外になった
    row.querySelectorAll('.mk').forEach(b => { b.outerHTML = mkHtml(v, b.dataset.p); });
  }

  // 数を変える（戻せるので確認はしない）。画面はすぐ変え、保存は裏で送る
  function setCount(vid, p, n) {
    const { note, label, pname } = U();
    const v = S().variants.get(vid), before = KC.api.have(p, vid);
    n = Math.max(0, n);
    if (!v || n === before) return;
    KC.api.count(p, vid, n);
    paintRow(vid);
    if (cur === vid) paintCounts();
    KC.scanUi.render();
    note(`${pname(p)}：${label(v)} ${before > 1 || n > 1 ? `${before}→${n}` : `${mkText(before)}→${mkText(n)}`}`);
  }
  // 印のタップ：押すたびに1匹増える（×→1→2→3…）。減らすのは大きく見る画面の −
  const tapMark = (vid, p) => setCount(vid, p, KC.api.have(p, vid) + 1);

  // オスメスの印を切り替える（もう一度押すと外れる。持っていない人は押せない）
  function toggleGender(vid, p, x) {
    const { note, label, pname } = U();
    const v = S().variants.get(vid), before = KC.api.gender(p, vid);
    if (!v || !KC.api.have(p, vid)) return;
    const s = before.includes(x) ? before.replace(x, '') : before + x;
    const g = (s.includes('m') ? 'm' : '') + (s.includes('f') ? 'f' : '');
    KC.api.setGender(p, vid, g);
    paintRow(vid);
    if (cur === vid) paintCounts();
    note(`${pname(p)}：${label(v)} ${gText(before)}→${gText(g)}`);
  }

  // 絵をたっぷり見る画面：2人ごとに名前・オスメス・数の −／＋
  let cur = null, pick = null;
  function paintCounts() {
    const { $, esc, pname, stepHtml } = U();
    $('sh-counts').innerHTML = ['a', 'b'].map(p => {
      const n = KC.api.have(p, cur), g = KC.api.gender(p, cur);
      const sex = ['m', 'f'].map(x => `<button data-g="${x}"${g.includes(x) ? ' class="on"' : ''}${n ? '' : ' disabled'} title="${x === 'm' ? 'オス' : 'メス'}のキラを持っている">${SYM[x]}</button>`).join('');
      return `<div class="cnt-row" data-p="${p}"><span class="p${p} grow">${esc(pname(p))}</span><span class="sex">${sex}</span>${stepHtml(n)}</div>`;
    }).join('');
  }
  function open(vid) {
    const { $, esc, picker, fillImages } = U();
    const v = S().variants.get(vid);
    if (!v) return;
    cur = vid;
    $('sh-img').src = KC.api.img(vid);
    paintCounts();
    pick = picker($('sh-picker'), { value: { no: v.no } });
    $('sh-cos').value = v.cos || '';
    const others = [...S().variants.values()].filter(x => x.no === v.no && x.id !== vid);
    $('sh-merge').innerHTML = others.length
      ? '<span>同じ絵としてまとめる</span>' + others.map(x => `<img data-vid="${esc(x.id)}" data-into="${esc(x.id)}" alt="" title="この絵にまとめる">`).join('')
      : '';
    fillImages($('sh-merge'));
    $('sheet').hidden = false;
  }
  const close = () => { U().$('sheet').hidden = true; cur = null; };

  function init() {
    const { $, note, name, label } = U();
    $('q').addEventListener('input', render);
    $('filter').addEventListener('click', e => {
      const b = e.target.closest('button[data-f]');
      if (!b) return;
      filter = b.dataset.f;
      $('filter').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
      render();
    });
    $('list').addEventListener('click', e => {
      const row = e.target.closest('.vrow[data-vid]');
      if (!row) return;
      const mk = e.target.closest('.mk');
      if (mk && !mk.disabled) tapMark(row.dataset.vid, mk.dataset.p);
      else if (e.target.closest('.th')) open(row.dataset.vid);
    });
    $('sh-close').addEventListener('click', close);
    $('sheet').addEventListener('click', e => { if (e.target === $('sheet')) close(); });
    $('sh-save').addEventListener('click', () => {
      const vid = cur, s = pick && pick.get(), v = S().variants.get(vid);
      const into = $('sh-merge').querySelector('img.sel');
      if (v && into) {
        // まとめると元の絵は台帳から消えるので戻せない（タップで選んで保存、の2段階にしている）
        close();
        KC.api.merge(vid, into.dataset.into);
        U().refresh();
        note(`${name(v.no)}：絵を1つまとめました`);
        return;
      }
      const no = s ? s.no : v && v.no, cos = $('sh-cos').value.trim();
      close();
      if (!v || (no === v.no && cos === v.cos)) return;
      const txt = `${label({ no: v.no, cos: v.cos })} → ${label({ no, cos })}`;
      KC.api.edit(vid, no, cos);
      U().refresh();
      note(txt);
    });
    // 2人の数の −／＋（押したらすぐ変わる）
    // オスメスの ♂／♀（押すたびに付く・外れる）
    $('sh-counts').addEventListener('click', e => {
      const b = e.target.closest('button[data-d],button[data-g]');
      if (!b || !cur || b.disabled) return;
      const p = b.closest('.cnt-row').dataset.p;
      if (b.dataset.g) toggleGender(cur, p, b.dataset.g);
      else setCount(cur, p, KC.api.have(p, cur) + Number(b.dataset.d));
    });
    // まとめ先をタップで選ぶ（もう一度タップで外す）
    $('sh-merge').addEventListener('click', e => {
      const im = e.target.closest('img[data-into]');
      if (!im) return;
      const on = !im.classList.contains('sel');
      $('sh-merge').querySelectorAll('img').forEach(x => x.classList.remove('sel'));
      im.classList.toggle('sel', on);
    });
  }

  return { init, render, open };
})();

// 取り込みの画面：スクショを読む → 台帳の絵と見比べる → 確認の表 → 追加
window.KC = window.KC || {};
KC.scanUi = (() => {
  const U = () => KC.ui;
  const S = () => KC.api.state;
  // 選んでいる人。端末に覚える（この端末を使う人。文字の大きさもこの人のものになる）
  let who = 'a';
  try { if (localStorage.getItem('kc-who') === 'b') who = 'b'; } catch { /* 覚えられなければ1人目 */ }
  // 読んだキラの絵（同じ絵は1つ）：{dataUrl, feat, vid, nameCanvas, cand:{vids,nos}, sel, seen, n}
  // seen：スクショ1枚に同じ絵が何匹写っていたか（何枚かあれば多い方。重なって写るので足さない）
  // n：入れる数（はじめは seen。−／＋で直す。0 なら入れない）
  let entries = [];
  let done = null;    // 最後の追加：{who, before, after, added}（before・after は全部で何匹）
  let running = false;

  async function featOf(dataUrl) {
    const im = new Image();
    im.src = dataUrl;
    await im.decode();
    return KC.scan.feature(im);
  }
  const prog = r => { U().$('progress').firstElementChild.style.width = Math.round(r * 100) + '%'; };

  async function read(files) {
    const { $ } = U();
    running = true;
    entries = [];   // 選び直したら、前に読んだ分は捨てる（数を数え直すため）
    done = null;
    $('add').disabled = true;
    $('who').classList.add('disabled');
    try {
      prog(0.02);
      // 台帳の絵の特徴をそろえる
      const ids = [...S().variants.keys()];
      await KC.api.fetchImages(ids);
      const known = [];
      for (const id of ids) { const f = await KC.api.feature(id); if (f) known.push([id, f]); }
      const fresh = [];
      for (let k = 0; k < files.length; k++) {
        const cells = (await KC.scan.readImage(files[k])).filter(c => c.lucky);
        const inShot = new Map();   // この1枚に、その絵が何匹写っているか
        for (const c of cells) {
          // Google のシートは1マス5万文字まで。超えそうなら画質を下げる
          let dataUrl = c.canvas.toDataURL('image/jpeg', 0.85);
          if (dataUrl.length > 45000) dataUrl = c.canvas.toDataURL('image/jpeg', 0.6);
          const feat = await featOf(dataUrl);
          const ds = known.map(([id, f]) => [id, KC.scan.distance(feat, f)]).sort((a, b) => a[1] - b[1]);
          let e;
          if (ds.length && ds[0][1] < KC.scan.SAME) {
            const vid = ds[0][0];
            e = entries.find(x => x.vid === vid);
            if (!e) entries.push(e = { dataUrl: KC.api.img(vid), vid, seen: 0 });
          } else {
            // 台帳にない絵。今回読んだ中に同じ絵があれば1つにする
            e = entries.find(x => !x.vid && x.feat && KC.scan.distance(feat, x.feat) < KC.scan.SAME);
            if (!e) {
              const near = ds.filter(d => d[1] < KC.scan.NEAR).slice(0, 4).map(d => d[0]);
              entries.push(e = { dataUrl, feat, vid: null, nameCanvas: c.nameCanvas, cand: { vids: near, nos: [] }, sel: null, seen: 0 });
              fresh.push(e);
            }
          }
          inShot.set(e, (inShot.get(e) || 0) + 1);
        }
        inShot.forEach((n, e) => { e.seen = Math.max(e.seen, n); e.n = e.seen; });
        prog(0.1 + 0.6 * (k + 1) / files.length);
        render();
      }
      // 台帳にない絵だけ、名前の文字を読んで種族の候補を出す（ヒント）
      if (fresh.length) {
        const texts = await KC.ocr.readAll(fresh.map(e => e.nameCanvas), (i, n) => prog(0.7 + 0.3 * i / n));
        fresh.forEach((e, i) => {
          const g = KC.ocr.guessEx(texts[i]);
          const nearNos = e.cand.vids.map(id => S().variants.get(id)?.no).filter(Boolean);
          e.cand.nos = [...new Set([...g.ids, ...nearNos])];
          // 名前がそのまま読めて1つに決まったときだけ、最初から入れておく
          if (g.sure && !e.sel) e.sel = { no: g.ids[0] };
        });
      }
      prog(1);
    } catch (err) {
      U().fail(err);
    } finally {
      running = false;
      $('who').classList.remove('disabled');
      render();
      setTimeout(() => prog(0), 600);
    }
  }

  // 今その人が持っている数（台帳の絵を選んだ行は、その絵の数）
  const base = e => { const id = e.vid || (e.sel && e.sel.vid); return id ? KC.api.have(who, id) : 0; };
  // 出す行：持っている数より多く写っていた絵だけ
  const visible = () => entries.filter(e => !(e.vid && KC.api.have(who, e.vid) >= e.seen));
  const ready = e => !!(e.vid || e.sel) && e.n > base(e);
  function updateAdd() { U().$('add').disabled = running || !visible().some(ready); }

  function render() {
    const { $, esc, name, pname, picker, stepHtml } = U();
    $('who').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.p === who));
    $('page-scan').dataset.who = who;   // 選んでいる人の色にする
    const list = $('scan-list');
    let html = '';
    if (done) {
      html += `<div class="done"><div class="cnt"><span class="p${done.who}">${esc(pname(done.who))}</span><b>${done.before} → ${done.after}</b></div>` +
        `<div class="thumbs">${done.added.map(id => `<span class="th sm"><img data-vid="${esc(id)}" alt=""></span>`).join('')}</div></div>`;
    }
    const vis = visible();
    if (entries.length && !vis.length && !running) html += '<div class="done">増えたキラはありません</div>';
    // 行：絵（押すと大きく）・名前（台帳にない絵は種族と衣装の欄）・持っている数（済）・入れる数の −／＋
    html += vis.map((e, i) => {
      const v = e.vid && S().variants.get(e.vid), had = base(e);
      return `<div class="srow${ready(e) ? '' : ' off'}" data-i="${i}"><span class="th"><img src="${e.dataUrl}" alt=""></span>` +
        (v ? `<span class="nm">${esc(name(v.no))}${v.cos ? `<small>${esc(v.cos)}</small>` : ''}</span>`
          : '<div class="nmcell"><div class="picker"></div><input class="cos" type="text" maxlength="12" placeholder="衣装" autocomplete="off"></div>') +
        `<span class="had" title="もう記録してある数">${had ? '済' + had : ''}</span>${stepHtml(e.n, 'このスクショで数えた数')}</div>`;
    }).join('');
    list.innerHTML = html;
    U().fillImages(list);
    // 台帳にない絵：種族を選ぶ欄と、衣装名の欄（台帳の絵を選んだら、その絵の衣装名を出して押せなくする）
    list.querySelectorAll('.srow').forEach(row => {
      const e = vis[+row.dataset.i], host = row.querySelector('.picker');
      if (!host) return;
      const cos = row.querySelector('.cos');
      const syncCos = () => {
        const v = e.sel && e.sel.vid && S().variants.get(e.sel.vid);
        cos.disabled = !!v;
        cos.value = v ? v.cos : (e.cos || '');
      };
      cos.addEventListener('input', () => { e.cos = cos.value; });
      picker(host, {
        value: e.sel,
        cands: () => [...e.cand.vids.map(id => ({ vid: id, no: S().variants.get(id)?.no })).filter(c => c.no), ...e.cand.nos.map(no => ({ no }))],
        onChange: s => {
          e.sel = s;
          paintRow(row, e);
          syncCos();
          updateAdd();
        },
      });
      syncCos();
    });
    updateAdd();
  }
  // 1行だけ描き直す（入れるか・済の数・−／＋の数）
  function paintRow(row, e) {
    const had = base(e);
    row.classList.toggle('off', !ready(e));
    row.querySelector('.had').textContent = had ? '済' + had : '';
    row.querySelector('.step b').textContent = e.n;
    row.querySelector('.step [data-d="-1"]').disabled = !e.n;
  }

  // 追加：画面はすぐ変え、保存は裏で送る（新しい絵はこの端末にも覚える）
  function add() {
    const { note, pname } = U();
    const p = who, rows = visible().filter(ready);
    if (!rows.length) return;
    const items = rows.map(e => e.vid ? { vid: e.vid, n: e.n } : e.sel.vid ? { vid: e.sel.vid, n: e.n } : { no: e.sel.no, img: e.dataUrl, cos: e.cos, n: e.n });
    const before = KC.api.total(p);
    const r = KC.api.add(p, items);
    rows.forEach((e, i) => {
      e.vid = r.ids[i];
      e.dataUrl = KC.api.img(e.vid) || e.dataUrl;
    });
    done = { who: p, before, after: KC.api.total(p), added: r.added };
    U().refresh();
    note(`${pname(p)}：${before} → ${done.after}匹`);
  }

  function init() {
    const { $ } = U();
    // 名前を押す ＝ その人のスクショを選ぶ（すぐ写真選びを開く）
    $('who').addEventListener('click', e => {
      const b = e.target.closest('button[data-p]');
      if (!b || running) return;
      who = b.dataset.p;
      try { localStorage.setItem('kc-who', who); } catch { /* その場だけ */ }
      entries.forEach(x => { x.n = x.seen; });   // 入れる数は数えた数に戻す
      render();
      $('files').click();
    });
    $('files').addEventListener('change', async () => {
      const fs = [...$('files').files];
      $('files').value = '';
      if (fs.length && !running) await read(fs);
    });
    $('add').addEventListener('click', add);
    // 絵を押すと大きく見る・−／＋で入れる数を直す
    $('scan-list').addEventListener('click', ev => {
      const row = ev.target.closest('.srow');
      if (!row) return;
      const e = visible()[+row.dataset.i];
      if (!e) return;
      if (ev.target.closest('.th')) { U().zoom(e.dataUrl); return; }
      const b = ev.target.closest('.step button[data-d]');
      if (!b) return;
      e.n = Math.max(0, e.n + Number(b.dataset.d));
      paintRow(row, e);
      updateAdd();
    });
  }

  return { init, render, read, get entries() { return entries; }, get who() { return who; } };
})();

KC.ui.boot();
</script>
</body>
</html>
